name: OpenWrt

on:
  workflow_dispatch:

env:
  VERSION: 24.10.1
  TARGET: mediatek
  SUBTARGET: mt7622

jobs:
  openwrt:
    runs-on: ubuntu-24.04
    steps:
    - name: Setup Build Bot
      run: |
        sudo apt-get update -y
        sudo apt-get upgrade -y
        sudo apt-get install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget libelf-dev -y

    - name: Download OpenWrt
      run: git clone https://git.openwrt.org/openwrt/openwrt.git -b v$VERSION OpenWrt

    - name: Update feeds
      working-directory: ./OpenWrt
      run: ./scripts/feeds update -a

    - name: Install feeds
      working-directory: ./OpenWrt
      run: ./scripts/feeds install -a

    - name: Get build config
      working-directory: ./OpenWrt
      run: curl https://downloads.openwrt.org/releases/$VERSION/targets/$TARGET/$SUBTARGET/config.buildinfo -o .config

    - name: Build defconfig
      working-directory: ./OpenWrt
      run: make -j1 defconfig

    - name: Download extra source
      working-directory: ./OpenWrt
      run: make -j1 download

    - name: Clean
      working-directory: ./OpenWrt
      run: make -j1 clean

    - name: Build
      working-directory: ./OpenWrt
      run: make -j4 world

    - uses: actions/upload-artifact@v4
      with:
        name: Firmware
        path: ./OpenWrt/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/*.*
        if-no-files-found: error
        include-hidden-files: yes
