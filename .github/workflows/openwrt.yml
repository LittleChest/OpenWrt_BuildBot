name: OpenWrt

on:
  workflow_dispatch:

env:
  VERSION: 25.12.0-rc1
  TARGET: qualcommax
  SUBTARGET: ipq807x

jobs:
  openwrt:
    runs-on: ubuntu-24.04
    steps:
    - name: Setup BuildBot
      run: |
        sudo apt-get update -y
        sudo apt-get install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget libelf-dev dwarves libev-dev xz-utils -y

    - name: Download OpenWrt
      run: git clone https://github.com/LittleChest/OpenWrt-NSS.git -b openwrt-25.12 OpenWrt

    - name: Install feeds
      working-directory: ./OpenWrt
      run: |
        ./scripts/feeds install -a
        ./scripts/feeds update -a

    - name: Download build config
      working-directory: ./OpenWrt
      run: curl https://raw.githubusercontent.com/LittleChest/OpenWrt_BuildBot/refs/heads/25.12-nss/Redmi-AX6.config -o .config

    - name: Download
      working-directory: ./OpenWrt
      run: make download -j$(nproc --all)

    - name: Build
      working-directory: ./OpenWrt
      run: make -j$(nproc --all) V=sc

    - name: Move Archives
      continue-on-error: true
      run: |
        mkdir ./OpenWrt/bin/targets/$TARGET/$SUBTARGET/archives/
        mv ./OpenWrt/bin/targets/$TARGET/$SUBTARGET/*.tar.zst ./OpenWrt/bin/targets/$TARGET/$SUBTARGET/archives/

    - name: Upload firmwares
      uses: actions/upload-artifact@v4
      with:
        name: Firmwares
        path: ./OpenWrt/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/*.*
        if-no-files-found: error

    - name: Upload packages
      uses: actions/upload-artifact@v4
      with:
        name: Packages
        path: ./OpenWrt/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/packages/*.*
        if-no-files-found: error

    - name: Upload archives
      uses: actions/upload-artifact@v4
      with:
        name: Archives
        path: ./OpenWrt/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/archives/*.*
        if-no-files-found: warn

    - name: Purge Cloudflare R2
      continue-on-error: true
      uses: wei/rclone@v1
      env:
        RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
      with:
        args: purge openwrt:openwrt --retries 1

    - name: Upload to Cloudflare R2
      uses: wei/rclone@v1
      env:
        RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
      with:
        args: rclone copy ./OpenWrt/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/packages/ openwrt:openwrt
