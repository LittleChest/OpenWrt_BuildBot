name: OpenWrt

on:
  workflow_dispatch:

env:
  VERSION: 25.12.5
  REPO: qosmio/openwrt-ipq
  BRANCH: 25.12-nss
  TARGET: qualcommax
  SUBTARGET: ipq807x

jobs:
  openwrt:
    runs-on: ubuntu-24.04
    steps:
    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@v1.3.1

    - name: Setup Build Bot
      run: |
        sudo apt-get update -y
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget

    - name: Download OpenWrt
      run: git clone https://github.com/$REPO.git -b $BRANCH OpenWrt

    - name: Update feeds
      working-directory: ./OpenWrt
      run: ./scripts/feeds update -a

    - name: Install feeds
      working-directory: ./OpenWrt
      run: ./scripts/feeds install -a

    - name: Download Custom packages
      working-directory: ./OpenWrt
      run: |
        git clone https://github.com/jerrykuku/luci-theme-argon.git -b master package/luci-theme-argon
        git clone https://github.com/jerrykuku/luci-app-argon-config.git -b master package/luci-app-argon-config

    - name: Get build config
      working-directory: ./OpenWrt
      run: |
        curl https://downloads.openwrt.org/releases/$VERSION/targets/$TARGET/$SUBTARGET/config.buildinfo -o .config
        cat <<EOF >> ./.config
        
        # Build Bot
        CONFIG_BUILDBOT=n
        CONFIG_ALL_NONSHARED=n
        CONFIG_IB=n
        CONFIG_COLLECT_KERNEL_DEBUG=n
        
        # NSS
        CONFIG_ATH11K_NSS_MESH_SUPPORT=y
        CONFIG_ATH11K_DEBUGFS_HTT_STATS=n
        CONFIG_ATH11K_DEBUGFS_STA=n
        CONFIG_PACKAGE_kmod-qca-mcs=y
        CONFIG_PACKAGE_sqm-scripts-nss=y
        CONFIG_FEED_nss_packages=n
        CONFIG_FEED_sqm_scripts_nss=n
        
        # Redmi AX6
        CONFIG_TARGET_MULTI_PROFILE=n
        CONFIG_TARGET_qualcommax_ipq807x_DEVICE_redmi_ax6=y
        
        # Love
        CONFIG_KERNEL_BUILD_USER="littlechest"
        CONFIG_KERNEL_BUILD_DOMAIN="github-actions"
        
        # Custom packages
        CONFIG_PACKAGE_ddns-scripts-cloudflare=y
        CONFIG_PACKAGE_luci-proto-wireguard=y
        CONFIG_PACKAGE_luci-app-ddns=y
        CONFIG_PACKAGE_luci-app-https-dns-proxy=y
        CONFIG_PACKAGE_luci-app-upnp=y
        CONFIG_PACKAGE_luci-app-wol=y
        CONFIG_PACKAGE_luci-theme-argon=y
        CONFIG_PACKAGE_luci-app-argon-config=y
        
        # zh_Hans
        CONFIG_LUCI_LANG_zh_Hans=y
        CONFIG_PACKAGE_luci-i18n-attendedsysupgrade-zh-cn=y
        CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
        CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y
        CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
        CONFIG_PACKAGE_luci-i18n-https-dns-proxy-zh-cn=y
        CONFIG_PACKAGE_luci-i18n-package-manager-zh-cn=y
        CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y
        CONFIG_PACKAGE_luci-i18n-wol-zh-cn=y
        
        EOF
        make defconfig -j1

    - name: Build
      working-directory: ./OpenWrt
      run: make -j$(nproc --all) V=sc

    - name: Move Archives
      continue-on-error: true
      run: |
        mkdir ./OpenWrt/bin/targets/$TARGET/$SUBTARGET/archives/
        mv ./OpenWrt/bin/targets/$TARGET/$SUBTARGET/*.tar.zst ./OpenWrt/bin/targets/$TARGET/$SUBTARGET/archives/

    - name: Upload firmwares
      uses: actions/upload-artifact@v4
      with:
        name: Firmwares
        path: ./OpenWrt/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/*.*
        if-no-files-found: error

    - name: Upload packages
      uses: actions/upload-artifact@v4
      with:
        name: Packages
        path: ./OpenWrt/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/packages/*.*
        if-no-files-found: error

    - name: Upload archives
      uses: actions/upload-artifact@v4
      with:
        name: Archives
        path: ./OpenWrt/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/archives/*.*
        if-no-files-found: warn

    - name: Purge Cloudflare R2
      continue-on-error: true
      uses: wei/rclone@v1
      env:
        RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
      with:
        args: purge openwrt:openwrt --retries 1

    - name: Upload to Cloudflare R2
      uses: wei/rclone@v1
      env:
        RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
      with:
        args: rclone copy ./OpenWrt/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/packages/ openwrt:openwrt
